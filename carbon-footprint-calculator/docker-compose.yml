services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carbon_footprint_calculator
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-9013}
      MYSQL_USER: ${MYSQL_USER:-cfc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cfc_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: carbon_footprint_calculator
      DB_USER: ${MYSQL_USER:-cfc_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cfc_pass}
      DB_HOST: db
      DB_PORT: 3306
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
